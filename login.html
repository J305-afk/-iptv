<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J305 | تسجيل الدخول</title>
    <meta name="description" content="تسجيل الدخول إلى J305." />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a href="/J305" class="brand" aria-label="J305">
          <img src="assets/images/j305-logo.svg" alt="J305 logo" />
          <span class="brand-name">J305</span>
        </a>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container" style="max-width: 500px;">
          <div class="contact-card">
            <h2 class="section-title">تسجيل الدخول</h2>
            <form class="contact-form">
              <input class="input" type="email" placeholder="البريد الإلكتروني" required />
              <input class="input" type="password" placeholder="كلمة المرور" required />
              <button class="btn btn-primary btn-submit" type="submit">دخول</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-copy">© <span id="year"></span> جميع الحقوق محفوظة</div>
        <div class="footer-admin">تحت إدارة منور المطيري</div>
      </div>
    </footer>

    <script src="assets/js/main.js"></script>
  </body>
</html>
