<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J305 | تواصل معنا</title>
    <meta name="description" content="تواصل مع J305 عبر النموذج الإلكتروني أو عبر وسائل الاتصال المتاحة." />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a href="/J305" class="brand" aria-label="J305">
          <img src="assets/images/j305-logo.svg" alt="J305 logo" />
          <span class="brand-name">J305</span>
        </a>

        <button class="menu-toggle" aria-label="فتح القائمة">☰</button>

        <nav class="nav-links">
          <a href="index.html">الرئيسية</a>
          <a href="about.html">من نحن</a>
          <a href="services.html">الخدمات</a>
          <a href="portfolio.html">أعمالنا</a>
          <a href="pricing.html">الأسعار</a>
          <a href="blog.html">المدونة</a>
          <a href="contact.html" class="active">تواصل</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <h1>تواصل معنا</h1>
        </div>
      </section>

      <section class="section">
        <div class="container contact-wrap">
          <div class="contact-card">
            <form class="contact-form" id="contactForm">
              <input class="input" type="text" placeholder="الاسم الكامل" required />
              <input class="input" type="email" placeholder="البريد الإلكتروني" required />
              <input class="input" type="text" placeholder="رقم الهاتف" required />
              <textarea class="input" placeholder="اكتب رسالتك هنا" required></textarea>
              <button class="btn btn-primary btn-submit" type="submit">إرسال الرسالة</button>
            </form>
          </div>

          <div class="contact-info">
            <div class="mini-box">
              <h4>البريد الإلكتروني</h4>
              <p>info@j305.com</p>
            </div>

            <div class="mini-box">
              <h4>الهاتف</h4>
              <p>+966 000 000 000</p>
            </div>

            <div class="mini-box">
              <h4>العنوان</h4>
              <p>المملكة العربية السعودية</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-copy">© <span id="year"></span> جميع الحقوق محفوظة</div>
        <div class="footer-admin">تحت إدارة منور المطيري</div>
      </div>
    </footer>

    <script src="assets/js/main.js"></script>
  </body>
</html>
